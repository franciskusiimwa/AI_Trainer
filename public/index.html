<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sarah Learns AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a click-through course, one scene per screen, ten levels climbing from Novice to Expert, fixed bottom nav like a phone app */
:root{
  --bg:#F7F8FA; --surface:#FFFFFF; --ink:#16202B; --muted:#5B6673; --line:#DFE3E8;
  --accent:#1F4E79; --accent-soft:#E6EEF6; --mark:#FFE28A; --good:#1E7B4F; --bad:#B3402F;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#17202A; --ink:#E8EDF2; --muted:#9AA6B2; --line:#2A3542;
  --accent:#7FB2E0; --accent-soft:#1C2C3C; --mark:#6B5A1E; --good:#5CC08E; --bad:#E58A7A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#17202A; --ink:#E8EDF2; --muted:#9AA6B2; --line:#2A3542;
  --accent:#7FB2E0; --accent-soft:#1C2C3C; --mark:#6B5A1E; --good:#5CC08E; --bad:#E58A7A; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
*{box-sizing:border-box}
.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 8px;display:flex;flex-direction:column;gap:8px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.toprow .rank{color:var(--accent)}
.sync{font-size:11px;letter-spacing:0;text-transform:none;font-weight:500;white-space:nowrap}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
main{flex:1;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 28px}
.scene{display:flex;flex-direction:column;gap:16px;animation:in .35s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.scene{animation:none}*{transition:none!important}}
h1,h2{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,8vw,44px)}
h2{font-size:clamp(24px,6vw,32px)}
h3{font-size:16px;margin:0;font-weight:600}
p{margin:0;max-width:64ch}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.story{border-left:3px solid var(--accent);padding:4px 0 4px 14px}
.story b{font-weight:600}
.coach{background:var(--accent-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tag{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.words{border:1.5px dashed var(--accent);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.words dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.words dt{font-weight:700;font-family:var(--display)}
.words dd{margin:0;color:var(--muted);font-size:14.5px}
@media (max-width:460px){.words dl{grid-template-columns:1fr}.words dd{margin-bottom:6px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.mono{font-family:var(--mono);font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:2px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--bg);border:0;border-radius:999px;padding:12px 20px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn[disabled]{opacity:.35;cursor:default}
nav.foot{display:flex;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);background:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
nav.foot .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.small{font-size:13.5px;color:var(--muted)}
ul.clean{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul.clean li{display:flex;gap:10px;align-items:flex-start}
.dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.dot.y{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.dot.n{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.dot.a{background:var(--accent);color:var(--bg)}
svg text{font-family:var(--body)}
.illo{width:100%;max-width:100%;height:auto}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td:first-child{font-weight:600}
/* level map */
.ladder{display:flex;flex-direction:column-reverse;gap:6px}
.rung{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.rung .n{font-family:var(--display);font-size:20px;font-weight:700;color:var(--accent);text-align:center}
.rung p{font-size:13.5px;color:var(--muted)}
.rung .rk{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* prediction */
.sentence{font-family:var(--display);font-size:clamp(22px,6vw,28px);font-weight:500;line-height:1.3;min-height:2.6em}
.sentence .new{background:var(--mark);border-radius:3px;padding:0 3px}
.prob{display:grid;grid-template-columns:90px 1fr 44px;gap:8px;align-items:center;font-size:14px}
.prob .track{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.prob .fill{height:100%;background:var(--accent);transition:width .4s}
.prob .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
/* flip cards */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:420px){.cards{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.card .term{font-family:var(--display);font-weight:700;font-size:18px}
.card .def{font-size:14px;color:var(--muted)}
.card .hint{font-size:12.5px;color:var(--accent);font-weight:600}
/* costar */
.costar{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.costar button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.costar button b{font-family:var(--display);font-size:22px;line-height:1}
.costar button span{font-size:10.5px;color:var(--muted)}
.costar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.costar button[aria-pressed="true"] span{color:var(--bg);opacity:.85}
.meter{display:flex;gap:4px}
.meter i{flex:1;height:8px;border-radius:4px;background:var(--line);transition:background .3s}
.meter i.on{background:var(--good)}
.out{background:var(--bg);border-radius:10px;padding:12px;font-size:14.5px}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* week */
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.day .d{font-size:12px;font-weight:700;text-align:center;color:var(--muted)}
.task{font-size:11.5px;line-height:1.3;padding:5px 6px;border-radius:6px;background:var(--bg)}
.task.rep{background:var(--mark)}
/* skill card */
.skill{border:1.5px solid var(--accent);border-radius:12px;overflow:hidden;background:var(--surface)}
.skill header{background:var(--accent);color:var(--bg);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:600;gap:8px}
.skill .row{padding:10px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
/* chat bubbles */
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:14.5px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--bg);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.panel .msg.ai{background:var(--bg)}
/* mock app window */
.mock{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:0 8px 24px -16px rgba(0,0,0,.35)}
.mock .chrome{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.mock .chrome i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.mock .chrome span{margin-left:8px}
.mock .body{display:grid;grid-template-columns:150px 1fr;min-height:260px}
@media (max-width:520px){.mock .body{grid-template-columns:96px 1fr}}
.mock .side{border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;background:var(--bg)}
.mock .side .it{padding:5px 6px;border-radius:6px;display:flex;align-items:center;gap:4px;min-width:0;overflow-wrap:anywhere}
.mock .side .it.on{background:var(--accent-soft);font-weight:600}
.mock .side .grp{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.mock .pane{padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mock .composer{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.mock .composer .ph{color:var(--muted)}
.mock .composer .tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mock .pill{border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:11.5px;display:inline-flex;align-items:center;gap:4px}
.mock .send{margin-left:auto;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-size:12px}
.mock .row2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.mock .field{display:flex;flex-direction:column;gap:3px;font-size:12px}
.mock .field .v{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;background:var(--bg)}
.tog{width:30px;height:17px;border-radius:9px;background:var(--line);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--surface)}
.tog.on{background:var(--good)}.tog.on::after{left:15px}
.cb{flex:none;width:18px;height:18px;border-radius:50%;background:var(--mark);color:var(--ink);font-size:11px;font-weight:700;display:inline-grid;place-items:center;border:1px solid color-mix(in srgb,var(--ink) 25%,transparent)}
.legend{display:flex;flex-direction:column;gap:8px}
.legend div{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.caption{font-size:12px;color:var(--muted);font-style:italic}
/* connectors */
.plugs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.plug{border:1px dashed var(--line);background:var(--surface);border-radius:10px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.plug b{font-size:15px}
.plug span{font-size:12.5px;color:var(--muted)}
.plug[aria-pressed="true"]{border-style:solid;border-color:var(--good)}
.plug[aria-pressed="true"] b::after{content:"  connected";font-size:11px;color:var(--good);font-weight:600}
/* flow steps */
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:28px 1fr;gap:12px;padding-bottom:14px;position:relative;opacity:.35;transition:opacity .4s}
.step.on{opacity:1}
.steps.static .step{opacity:1}
.step::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step .num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700}
.step .num.you{background:var(--mark);color:var(--ink)}
.step .src{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
#cap .step{grid-template-columns:46px 1fr}#cap .num{width:46px;border-radius:14px;font-size:11.5px}#cap .step::before{left:22px}
/* quiz */
.quiz{background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.quiz .q{font-weight:600}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14.5px}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.why{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--accent-soft)}
textarea{width:100%;min-height:84px;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
/* order exercise */
.ord{display:flex;flex-direction:column;gap:6px}
.ord button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14.5px;display:flex;gap:10px;align-items:center}
.ord button .k{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.ord button.picked{opacity:.55}
.ord button.picked .k{background:var(--accent);color:var(--bg);border-color:var(--accent)}
/* agent loop */
.loopwrap{display:flex;justify-content:center}
/* checklist */
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.check label{display:flex;flex-direction:column;gap:2px;cursor:pointer}
.check .when{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.menu{display:flex;flex-direction:column;gap:6px}
.menu button{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.menu button span{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.score{font-family:var(--display);font-size:56px;font-weight:700;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.arch{display:flex;flex-direction:column;gap:8px}
.lane{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:stretch}
.lane .ln{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:10px}
.lane .bx{display:flex;flex-wrap:wrap;gap:6px}
.lane .bx span{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:13.5px;font-weight:500}
.lane .bx span.hl{border-color:var(--accent);background:var(--accent-soft)}
.lane .bx span.you{background:var(--mark);border-color:transparent}
@media (max-width:460px){.lane{grid-template-columns:1fr}.lane .ln{padding-top:0}}
</style>

<div class="app">
  <div class="top">
    <div class="toprow"><span id="chap">Start</span><span class="rank" id="rank"></span><span class="sync" id="syncStatus" role="status" aria-live="polite">Connecting</span><button id="menuBtn" class="chip" style="padding:4px 12px;font-size:12px">Levels</button></div>
    <div class="bar"><i id="bar"></i></div>
  </div>
  <main id="main"></main>
  <nav class="foot">
    <button class="btn ghost" id="back">Back</button>
    <span class="count" id="count"></span>
    <button class="btn" id="next">Next</button>
  </nav>
</div>

<script>
/* ---------- helpers ---------- */
const S=[], LEVELS=[];
let LV=null;
function level(n,name,rank,blurb){LV={n,name,rank,blurb,start:S.length};LEVELS.push(LV);}
function add(html,init){S.push({lv:LV,html,init});}
const syncStatus=document.getElementById('syncStatus');
let syncEnabled=false,syncQueue=Promise.resolve();
const pendingSync=new Map();
function setSyncStatus(value){syncStatus.textContent=value;}
function syncValue(k,v){
  if(!syncEnabled)return;
  clearTimeout(pendingSync.get(k));
  pendingSync.set(k,setTimeout(()=>{
    pendingSync.delete(k);
    syncQueue=syncQueue.catch(()=>{}).then(async()=>{
      setSyncStatus('Saving');
      const response=await fetch('/api/progress',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({key:k,value:v})});
      if(!response.ok)throw new Error('Progress sync failed.');
      setSyncStatus('Synced');
    }).catch(()=>setSyncStatus('Local only'));
  },300));
}
const store={get(k,d){try{const v=localStorage.getItem('sla-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('sla-'+k,JSON.stringify(v))}catch(e){}syncValue(k,v)},keys(){try{return Object.keys(localStorage).filter(k=>k.startsWith('sla-'))}catch(e){return[]}}};
const QUIZ={}; let QN=0;
function quiz(q,opts){const id='q'+(++QN);QUIZ[id]=opts;
  return `<div class="quiz" data-quiz="${id}"><div class="tag">Check your understanding</div><div class="q">${q}</div>${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o[0]}</button>`).join('')}<div class="why" hidden></div></div>`;}
function reflect(id,q,ph){return `<div class="panel"><div class="tag">Your turn to think</div><label for="r-${id}" style="font-weight:600">${q}</label><textarea id="r-${id}" data-reflect="${id}" placeholder="${ph}"></textarea><span class="small">Saved on this device and synced to the course server when online.</span></div>`;}
function words(list){return `<div class="words"><div class="tag">New words on this screen</div><dl>${list.map(([t,d])=>`<dt>${t}</dt><dd>${d}</dd>`).join('')}</dl></div>`;}
function coach(tag,html){return `<div class="coach"><span class="tag">${tag}</span><p>${html}</p></div>`;}
const MOCKNOTE='<p class="caption">Simplified drawing to show the layout. Real screens change often, so yours may look a little different.</p>';

/* =========================================================
   START
   ========================================================= */
level(0,"Start","","Meet Sarah");
add(`
<div class="eyebrow">A course in ten levels</div>
<h1>Sarah bakes bread. By the end, AI runs her marketing.</h1>
<p class="story"><b>Sarah Namata</b> runs Namata Bakes in Ntinda, Kampala. Three staff, a small shop, most orders on WhatsApp. She has never opened an AI app. We will follow her from her first message all the way to an AI setup that plans, designs and publishes her marketing every Monday while she is in the kitchen.</p>
<div class="panel">
  <div class="label">The ten levels</div>
  <div class="ladder" id="map"></div>
</div>
${coach("How this course works","Every level does three things. It <b>introduces new words</b> before using them, <b>shows</b> what it looks like on screen, then <b>checks</b> you understood with a short question. Take your time. Your progress saves on this device and syncs to the course server when online.")}
`,()=>{document.getElementById('map').innerHTML=LEVELS.filter(l=>l.n>0).map(l=>`<div class="rung"><div class="n">${l.n}</div><div><h3>${l.name}</h3><p>${l.blurb}</p></div><span class="rk">${l.rank}</span></div>`).join('');});

add(`
<div class="eyebrow">Level 1 · How it answers</div>
<h2>It writes one word at a time, picking the most likely next word</h2>
<p>Under the hood, AI is a very powerful guesser. It looks at everything written so far and predicts what comes next. Tap the button to watch it build Sarah's sentence.</p>
<div class="panel">
  <div class="sentence" id="sent">Our bread is baked</div>
  <div id="probs" style="display:flex;flex-direction:column;gap:6px"></div>
  <button class="btn" id="predict" style="align-self:flex-start">Predict next word</button>
</div>
${coach("Why this matters for you","Because it predicts from what you give it, <b>the words you type steer everything</b>. A vague question gets the most average answer. A detailed one gets an answer shaped for you. That is the secret of Level 2.")}
`,()=>{
  const steps=[[["fresh",58],["daily",24],["with",11]],[["every",64],["each",19],["in",9]],[["morning",61],["day",27],["night",4]],[["in",47],[".",33],["by",12]],[["Ntinda",52],["Kampala",31],["our",10]]];
  let i=0;const sent=document.getElementById('sent'),probs=document.getElementById('probs'),b=document.getElementById('predict');
  const show=()=>{if(i>=steps.length){probs.innerHTML='<p class="small">Five guesses in a row made a sensible sentence. A full answer is thousands of these.</p>';b.textContent='Start again';return;}
    probs.innerHTML=steps[i].map(([w,p],k)=>`<div class="prob"><span>${k?w:'<b>'+w+'</b>'}</span><div class="track"><div class="fill" style="width:0" data-w="${p}"></div></div><span class="pct">${p}%</span></div>`).join('');
    requestAnimationFrame(()=>probs.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%'));};
  b.onclick=()=>{if(i>=steps.length){i=0;sent.textContent='Our bread is baked';b.textContent='Predict next word';show();return;}
    const w=steps[i][0][0];sent.querySelectorAll('.new').forEach(n=>n.classList.remove('new'));
    sent.insertAdjacentHTML('beforeend',(w==='.'?'':' ')+`<span class="new">${w}</span>`);i++;show();};
  probs.innerHTML='<p class="small">Each tap shows the top guesses and picks the most likely one.</p>';
});

<h2>Quick check before Level 2</h2>
${quiz("Sarah asks the AI: 'What did we sell most of last week?' and it gives a confident answer. What should she think?",[
 ["Great, it knows her sales.",0,"Not yet. Nothing has connected it to her sales records, so the answer is a guess dressed up as a fact."],
 ["It is guessing. It cannot see her sales unless she pastes them in or connects her records.",1,"Exactly. A model only knows what it learned in training plus what you give it. Her sales are not in either."],
 ["It must have searched the internet for her shop.",0,"Even with web search, her private sales numbers are not on the internet. The answer is made up."]])}
${quiz("Why does a detailed question usually get a better answer?",[
 ["Because the AI tries harder when you type more.",0,"It does not 'try harder.' It predicts from what you give it."],
 ["Because the AI predicts its answer from your words, so more relevant detail steers it toward what you need.",1,"Yes. Your words are the steering wheel."],
 ["It does not matter. Short questions work just as well.",0,"For simple facts, yes. For business writing, short questions get the average answer."]])}
`);

${words([["Chatbot","The app where you type to the model. You open it on the web, on your phone or on a computer."],["Chat","One conversation. Like one WhatsApp thread. You can start a new one any time."],["Prompt","Whatever you type into the box. Your instruction or question."]])}
<div class="chips" id="appTabs"><button class="chip" aria-pressed="true" data-a="0">Claude</button><button class="chip" aria-pressed="false" data-a="1">ChatGPT</button><button class="chip" aria-pressed="false" data-a="2">Gemini</button></div>

`,()=>{
  const A=[
   {url:"claude.ai",side:["New chat","Chats","Projects","Artifacts"],tools:["+ Files","Connectors","Search"],model:"Claude model"},
   {url:"chatgpt.com",side:["New chat","Search chats","Projects","GPTs"],tools:["+ Files","Apps","Search"],model:"ChatGPT model"},
   {url:"gemini.google.com",side:["New chat","Recent","Gems","Saved info"],tools:["+ Files","Tools","Apps"],model:"Gemini model"}];
  const el=document.getElementById('chatMock'),lg=document.getElementById('chatLegend');
  const draw=i=>{const a=A[i];
    el.innerHTML=`<div class="chrome"><i></i><i></i><i></i><span>${a.url}</span></div><div class="body">
     <div class="side"><div class="it on"><span class="cb">1</span>${a.side[0]}</div><div class="it">${a.side[1]}</div><div class="it"><span class="cb">2</span>${a.side[2]}</div><div class="it">${a.side[3]}</div><div class="grp">Recent</div><div class="it">Weekly special</div><div class="it">Wedding quote</div></div>
     <div class="pane"><div class="pill" style="align-self:flex-start"><span class="cb">3</span>${a.model} ▾</div>
      <div class="msg me" style="align-self:flex-end;font-size:13px">Write a post about my cakes</div>

    lg.innerHTML=[["1","Start a fresh conversation. Use a new chat for each new topic."],["2",`Folders and saved assistants. You will meet these in Levels 3 and 4. Here called "${a.side[2]}" and "${a.side[3]}".`],["3","Which model is answering. Bigger models think more deeply; smaller ones are faster."],["4","The message box. This is where your prompt goes."],["5","Attach files or photos: a price list, a receipt, a photo of your shop window."],["6",`Tools and connected apps (Level 5). Here called "${a.tools[1]}".`]].map(([n,t])=>`<div><span class="cb">${n}</span><span>${t}</span></div>`).join('');
    document.querySelectorAll('#appTabs .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.a==i));};
  document.querySelectorAll('#appTabs .chip').forEach(c=>c.onclick=()=>draw(+c.dataset.a));draw(0);
});

add(`
<div class="eyebrow">Level 2 · The CO-STAR framework</div>
<h2>Brief it like you would brief a person</h2>
${words([["Framework","A checklist you follow so you do not forget anything important."],["CO-STAR","A prompting checklist that won Singapore's national prompt engineering competition in 2023 and is now widely taught: Context, Objective, Style, Tone, Audience, Response."]])}
<p>Tap each letter to add it to Sarah's prompt and watch the answer improve.</p>
<div class="costar" id="costar"></div>
<div class="panel">
  <div class="label">Prompt strength</div>
  <div class="meter" id="meter"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="label">Her prompt</div>
  <div class="mono" id="prompt"></div>
  <div class="label">What she gets back</div>
  <div class="out" id="answer"></div>
</div>
`,()=>{
  const parts=[["C","Context","Context: I run Namata Bakes, a small bakery in Ntinda, Kampala. Most orders come through WhatsApp."],
   ["O","Objective","Objective: Write a WhatsApp status post to sell our new passion fruit cake this weekend."],
   ["S","Style","Style: Short and chatty, like a friendly shop owner. Under 60 words."],
   ["T","Tone","Tone: Warm and a bit playful. No over-the-top words like 'indulge'."],
   ["A","Audience","Audience: Office workers and young mothers around Ntinda and Kyambogo."],
   ["R","Response","Response: Give me 3 options. Each must include the price (UGX 45,000 for 1kg) and 'order on 0772 000 000'."]];
  const ans=["Indulge in our delicious, freshly baked cakes! Made with love and the finest ingredients, perfect for any occasion. 🎂✨",
   "Namata Bakes in Ntinda has fresh cakes ready! Order on WhatsApp today. 🎂",
   "New at Namata Bakes: passion fruit cake, this weekend only! Order on WhatsApp. 🍰",
   "Hey Ntinda! Our new passion fruit cake drops this weekend. Sweet, a little tangy, very fresh. Message us to book yours.",
   "Hey Ntinda! Passion fruit cake lands this weekend. Tangy, soft, gone by Sunday. Book yours on WhatsApp before we run out.",
   "Hey Ntinda! Office treat or Saturday surprise for the kids? Our new passion fruit cake is here this weekend. Soft, tangy and fresh.",
   "Option 1: Office treat sorted! New passion fruit cake this weekend, 1kg for UGX 45,000. Order on 0772 000 000.<br>Option 2: Mummies of Ntinda, Saturday dessert is handled 😄 Passion fruit cake, UGX 45,000. Order on 0772 000 000.<br>Option 3: Tangy, soft, gone by Sunday. Passion fruit cake 1kg, UGX 45,000. Order on 0772 000 000."];
  const on=parts.map(()=>false),box=document.getElementById('costar');
  box.innerHTML=parts.map(([l,n],i)=>`<button aria-pressed="false" data-i="${i}"><b>${l}</b><span>${n}</span></button>`).join('');
  const r=()=>{const n=on.filter(Boolean).length;document.querySelectorAll('#meter i').forEach((m,i)=>m.classList.toggle('on',i<n));
    document.getElementById('prompt').innerHTML=n?parts.filter((_,i)=>on[i]).map(p=>p[2].replace(/^(\w+):/,'<mark>$1:</mark>')).join('\n'):'Write a post about my cakes';
    document.getElementById('answer').innerHTML=ans[n];};
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;on[i]=!on[i];b.setAttribute('aria-pressed',on[i]);r();});r();
});

/* ---------- engine ---------- */
let cur=0,inMenu=false;
const main=document.getElementById('main'),back=document.getElementById('back'),next=document.getElementById('next');
function wireCommon(){
  const res=store.get('quiz',{});
  main.querySelectorAll('[data-quiz]').forEach(q=>{const id=q.dataset.quiz,opts=QUIZ[id],why=q.querySelector('.why');
    const reveal=(i)=>{q.querySelectorAll('.opt').forEach((b,k)=>{if(opts[k][1])b.classList.add('right');else if(k===i)b.classList.add('wrong');});why.hidden=false;why.innerHTML=(opts[i][1]?'<b>Correct.</b> ':'<b>Not quite.</b> ')+opts[i][2];};
    if(res[id+'i']!=null) reveal(res[id+'i']);
    q.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,r=store.get('quiz',{});
      if(r[id]==null){r[id]=!!opts[i][1];} r[id+'i']=i; store.set('quiz',r);
      q.querySelectorAll('.opt').forEach(x=>x.classList.remove('right','wrong'));reveal(i);});});
  main.querySelectorAll('[data-reflect]').forEach(t=>{t.value=store.get('r-'+t.dataset.reflect,'');t.oninput=()=>store.set('r-'+t.dataset.reflect,t.value);});
}
function go(i){inMenu=false;cur=Math.max(0,Math.min(S.length-1,i));
  main.innerHTML=`<section class="scene">${S[cur].html}</section>`;main.scrollTop=0;
  wireCommon();S[cur].init&&S[cur].init();
  const lv=S[cur].lv;document.getElementById('chap').textContent=lv.n?`Level ${lv.n}`:'Start';
  document.getElementById('rank').textContent=lv.rank;
  document.getElementById('bar').style.width=(cur/(S.length-1)*100)+'%';
  document.getElementById('count').textContent=`${cur+1} / ${S.length}`;
  back.disabled=cur===0;next.textContent=cur===0?'Begin':cur===S.length-1?'Start over':'Next';
  try{history.replaceState(null,'','#s'+cur)}catch(e){}}
back.onclick=()=>go(cur-1);
next.onclick=()=>go(cur===S.length-1?0:cur+1);
document.getElementById('menuBtn').onclick=()=>{if(inMenu){go(cur);return;}inMenu=true;
  main.innerHTML=`<section class="scene"><div class="eyebrow">Jump to a level</div><div class="menu">${LEVELS.map(l=>`<button data-go="${l.start}"><b>${l.n?l.n+'. ':''}${l.name}</b><span>${l.rank||'Intro'}</span></button>`).join('')}</div></section>`;
  main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));};
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft'&&!back.disabled)back.click();});
async function startApp(){
  const h=(location.hash.match(/^#s(\d+)$/)||[])[1];
  try{
    const response=await fetch('/api/progress');
    if(!response.ok)throw new Error('Progress load failed.');
    const {progress={}}=await response.json();
    const localProgress={};
    for(const localKey of store.keys()){
      const key=localKey.slice(4);
      try{localProgress[key]=JSON.parse(localStorage.getItem(localKey));}catch(e){}
    }
    for(const [key,value] of Object.entries(localProgress)){
      if(!Object.prototype.hasOwnProperty.call(progress,key)){
        const saved=await fetch('/api/progress',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({key,value})});
        if(!saved.ok)throw new Error('Progress migration failed.');
      }
    }
    for(const [key,value] of Object.entries(progress)){
      try{localStorage.setItem('sla-'+key,JSON.stringify(value));}catch(e){}
    }
    syncEnabled=true;
    setSyncStatus('Synced');
  }catch(e){
    syncEnabled=location.protocol==='http:'||location.protocol==='https:';
    setSyncStatus('Local only');
  }
  go(h?+h:0);
}
startApp();
</script>
